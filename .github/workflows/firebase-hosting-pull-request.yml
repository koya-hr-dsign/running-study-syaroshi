# PR ごとに確認用の一時 URL（7日で失効）を作り、PR にコメントする。
name: Deploy to Firebase Hosting (preview)

on:
  pull_request:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  preview:
    # フォークからの PR には認証を渡さない
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy preview channel
        id: deploy
        run: |
          npx --yes firebase-tools@15 hosting:channel:deploy "pr-${{ github.event.number }}" \
            --expires 7d --project running-study-syaroshi --non-interactive --json > deploy.json
          url=$(jq -r '.result[].url' deploy.json | head -n1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "プレビュー: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.number }}" --repo "${{ github.repository }}" \
            --body "🔥 プレビュー（7日間有効）: ${{ steps.deploy.outputs.url }}" --edit-last \
          || gh pr comment "${{ github.event.number }}" --repo "${{ github.repository }}" \
            --body "🔥 プレビュー（7日間有効）: ${{ steps.deploy.outputs.url }}"
