# main に入ったら本番（running-study-syaroshi.web.app）へ公開する。
# 鍵ファイルは使わず、Workload Identity 連携で一時的な認証を受け取る。
name: Deploy to Firebase Hosting (live)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy
        run: npx --yes firebase-tools@15 deploy --only hosting --project running-study-syaroshi --non-interactive
